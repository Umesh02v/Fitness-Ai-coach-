version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: fitmind-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: fitmind_db
      MYSQL_USER: fitmind
      MYSQL_PASSWORD: fitmindpass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: fitmind-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/fitmind_db
      SPRING_DATASOURCE_USERNAME: fitmind
      SPRING_DATASOURCE_PASSWORD: fitmindpass
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
